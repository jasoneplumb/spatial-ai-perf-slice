name: Release

# Publishes a GitHub release for a plain vX.Y.Z tag (no suffix).
#
# A tag push runs this automatically. Manual dispatch covers a tag that was
# pushed before this workflow existed, or a release that has to be re-created.
# The tag is never created or moved here.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.2.0"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check the tag name
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a plain vX.Y.Z tag."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # The same checks as CI, run against the tagged tree.
      - run: python -m pip install numpy==2.4.6
      - run: python -m unittest discover -s tests -v

      - name: Check the tag against the changelog
        run: |
          version=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the newest changelog version ($version) in the tagged tree."
            exit 1
          fi

      # Notes come from the default branch, so they can be corrected without moving the tag.
      - name: Collect the release notes
        run: |
          git fetch --quiet origin "$DEFAULT_BRANCH"
          if ! git show "FETCH_HEAD:.github/release-notes/$TAG.md" > "$RUNNER_TEMP/notes.md"; then
            echo "::error::.github/release-notes/$TAG.md is missing on $DEFAULT_BRANCH."
            exit 1
          fi
          test -s "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Delete it first to re-create it."
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
