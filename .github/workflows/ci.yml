name: ci

on:
  push:
    branches: [mainline]
  pull_request:

permissions:
  contents: read

jobs:
  release-checks:
    # No GPU, OpenPCDet, dataset or checkpoint: syntax, synthetic-scan determinism and repository invariants only.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Pinned because the tests compare a bit-exact hash of generated float32 data.
      - run: python -m pip install numpy==2.4.6
      - run: python -m unittest discover -s tests -v
