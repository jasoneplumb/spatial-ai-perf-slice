name: CI

on:
  push:
    branches:
      - mainline
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# What a green run means: the Python and shell sources parse, the synthetic
# scan generator reproduces its documented output, and the repository
# invariants hold (nothing restricted tracked, consistent pins and versions,
# no broken documentation references). Nothing here uses a GPU, OpenPCDet, a
# dataset or a checkpoint; the CUDA profiling tools are not covered by CI.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Pinned because the tests compare a bit-exact hash of generated float32 data.
      - run: python -m pip install numpy==2.4.6
      - run: python -m unittest discover -s tests -v
